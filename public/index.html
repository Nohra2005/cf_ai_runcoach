<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RunCoach AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
      --border: #2e2e2e; --accent: #f97316;
      --text: #f0f0f0; --muted: #888;
      --user-bg: #1e3a5f; --coach-bg: #1e1e1e;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; max-width: 720px; padding: 18px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .header-text h1 { font-size: 16px; font-weight: 700; }
    .header-text p { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .reset-btn { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
    #chat { flex: 1; width: 100%; max-width: 720px; overflow-y: auto; padding: 24px 24px 8px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 12px; text-align: center; padding: 40px 0; }
    .welcome .icon { font-size: 48px; }
    .welcome h2 { font-size: 22px; font-weight: 700; }
    .welcome p { font-size: 14px; color: var(--muted); max-width: 380px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .chip { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .msg { display: flex; gap: 10px; animation: fadeIn 0.2s ease; }
    .msg.user { flex-direction: row-reverse; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; margin-top: 2px; }
    .msg.user .avatar { background: var(--user-bg); }
    .msg.coach .avatar { background: var(--accent); }
    .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
    .msg.coach .bubble { background: var(--coach-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .typing .bubble { display: flex; align-items: center; gap: 5px; padding: 14px 18px; }
    .dot { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    .input-area { width: 100%; max-width: 720px; padding: 16px 24px 24px; }
    .input-row { display: flex; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
    .input-row:focus-within { border-color: var(--accent); }
    #msgInput { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; resize: none; min-height: 24px; max-height: 120px; line-height: 1.5; font-family: inherit; }
    #msgInput::placeholder { color: var(--muted); }
    #sendBtn { background: var(--accent); border: none; border-radius: 8px; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: flex-end; }
    #sendBtn:hover { opacity: 0.85; }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #sendBtn svg { width: 16px; height: 16px; fill: white; }
    .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
<header>
  <div class="logo">🏃</div>
  <div class="header-text">
    <h1>RunCoach AI</h1>
    <p>Llama 3.3 · Cloudflare Workers AI · Durable Objects</p>
  </div>
  <button class="reset-btn" onclick="resetSession()">New Session</button>
</header>

<div id="chat">
  <div class="welcome" id="welcome">
    <div class="icon">🏅</div>
    <h2>Your personal running coach</h2>
    <p>Log workouts, get training plans, ask about pace, recovery, and nutrition. I remember your full session history.</p>
    <div class="chips">
      <button class="chip" onclick="suggest(this)">I ran 8km at 5:30/km — how did I do?</button>
      <button class="chip" onclick="suggest(this)">Build me a 10K plan for a beginner</button>
      <button class="chip" onclick="suggest(this)">My legs are sore after yesterday's long run</button>
      <button class="chip" onclick="suggest(this)">What should I eat before a race?</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="msgInput" placeholder="Log a workout or ask a question..." rows="1"
      onkeydown="handleKey(event)" oninput="resize(this)"></textarea>
    <button id="sendBtn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
  <p class="hint">Enter to send · Shift+Enter for new line</p>
</div>

<script>
  const API = '';
  let sessionId = localStorage.getItem('runcoach_session');
  if (!sessionId) {
    sessionId = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    localStorage.setItem('runcoach_session', sessionId);
  }

  const chat = document.getElementById('chat');
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');

  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  function esc(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  function addMsg(role, text) {
    hideWelcome();
    const d = document.createElement('div');
    d.className = `msg ${role}`;
    d.innerHTML = `<div class="avatar">${role === 'user' ? '👤' : '🏃'}</div><div class="bubble">${esc(text)}</div>`;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    hideWelcome();
    const d = document.createElement('div');
    d.className = 'msg coach typing';
    d.id = 'typing';
    d.innerHTML = `<div class="avatar">🏃</div><div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    resize(input);
    btn.disabled = true;
    addMsg('user', text);
    addTyping();
    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json();
      removeTyping();
      addMsg('coach', data.reply || '⚠️ No response.');
    } catch (e) {
      removeTyping();
      addMsg('coach', '⚠️ Connection error. Is the Worker running?');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  function suggest(el) { input.value = el.textContent; send(); }

  async function resetSession() {
    try {
      await fetch(`${API}/api/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
    } catch(e) {}
    localStorage.removeItem('runcoach_session');
    location.reload();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // Load history
  (async () => {
    try {
      const res = await fetch(`${API}/api/history?sessionId=${sessionId}`);
      const data = await res.json();
      if (data.history?.length) data.history.forEach(m => addMsg(m.role === 'user' ? 'user' : 'coach', m.content));
    } catch(e) {}
  })();

  input.focus();
</script>
</body>
</html>
